<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" role="img" aria-label="mask">
  <defs>
    <clipPath id="frame"><rect x="16" y="16" width="168" height="168" rx="6"/></clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#000" opacity=".14"/>
    </pattern>
  </defs>

  <style>
    .glitch-a { animation: ga 3.4s steps(1, end) infinite; }
    .glitch-b { animation: gb 3.4s steps(1, end) infinite; }
    .flick    { animation: fl 3.4s steps(1, end) infinite; }
    @keyframes ga { 0%, 88%, 100% { transform: none; opacity: 0 } 90% { transform: translateX(-5px); opacity: .9 } 94% { transform: translateX(3px); opacity: .7 } }
    @keyframes gb { 0%, 88%, 100% { transform: none; opacity: 0 } 92% { transform: translateX(5px); opacity: .8 } 96% { transform: translateX(-2px); opacity: .5 } }
    @keyframes fl { 0%, 89%, 100% { opacity: 1 } 91% { opacity: .82 } 95% { opacity: .93 } }
    @media (prefers-reduced-motion: reduce) { .glitch-a, .glitch-b, .flick { animation: none; opacity: 0 } .flick { opacity: 1 } }
  </style>

  <!-- poster frame -->
  <rect x="4" y="4" width="192" height="192" rx="10" fill="#000"/>
  <rect x="16" y="16" width="168" height="168" rx="6" fill="none" stroke="#fff" stroke-width="7"/>

  <g clip-path="url(#frame)">
    <g class="flick">
      <!-- head -->
      <path d="M100 32c34 0 58 26 58 61 0 25-6 46-17 61-9 12-24 19-41 19s-32-7-41-19c-11-15-17-36-17-61 0-35 24-61 58-61Z" fill="#fff"/>
      <!-- brows: angled down and out -->
      <path d="M54 92 96 80l2 13-42 10Z"/>
      <path d="M146 92 104 80l-2 13 42 10Z"/>
      <!-- eyes -->
      <path d="M60 105 94 113l-4 11-30-9Z"/>
      <path d="M140 105 106 113l4 11 30-9Z"/>
      <circle cx="76" cy="113" r="3.2" fill="#fff"/>
      <circle cx="124" cy="113" r="3.2" fill="#fff"/>
      <!-- nose -->
      <path d="M96 116h8l5 17H91Z"/>
      <!-- grin -->
      <path d="M68 140c9 26 55 26 64 0-17 9-47 9-64 0Z"/>
      <g fill="#fff">
        <rect x="86" y="145" width="5" height="10" rx="1"/>
        <rect x="97.5" y="146" width="5" height="11" rx="1"/>
        <rect x="109" y="145" width="5" height="10" rx="1"/>
      </g>
    </g>
    <!-- glitch copies -->
    <g class="glitch-a" fill="#00ff9c" opacity="0">
      <rect x="16" y="92" width="168" height="12"/>
    </g>
    <g class="glitch-b" fill="#ff3b3b" opacity="0">
      <rect x="16" y="136" width="168" height="8"/>
    </g>
    <rect x="16" y="16" width="168" height="168" fill="url(#scan)"/>
  </g>

  <!-- caption -->
  <text x="100" y="224" text-anchor="middle" fill="#fff"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="26" font-weight="700" letter-spacing="2">unlocked</text>
</svg>
