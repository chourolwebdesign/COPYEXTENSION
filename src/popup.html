<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>CopyPaste Unlocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="card">
    <header class="head">
      <img class="logo" src="../icons/icon48.png" alt="" width="32" height="32">
      <div>
        <h1>CopyPaste Unlocker</h1>
        <p class="host">azubiheft.de</p>
      </div>
    </header>

    <label class="row" for="toggle">
      <span class="label">
        <span class="title">Kopyalama kilidi</span>
        <span id="status" class="status">Yükleniyor…</span>
      </span>
      <input id="toggle" type="checkbox" class="switch" role="switch" disabled>
    </label>

    <p class="hint">azubiheft.de üzerinde Ctrl+C, Ctrl+V ve Ctrl+X çalışır. Değişiklik anında geçerli olur — sayfayı yenilemeye gerek yok.</p>
    <p class="foot">
      <a href="welcome.html" target="_blank" rel="noopener">Tanıtım videosunu izle</a>
      <span class="sep">·</span> Hiçbir veri toplanmaz.
    </p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
