<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>CopyPaste Unlocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>CopyPaste Unlocker</h1>

  <!-- before activation -->
  <section id="screen-activate" hidden>
    <p class="lead">Lizenz aktivieren</p>
    <label class="sr" for="key">License Key eingeben</label>
    <input id="key" type="text" inputmode="latin" autocomplete="off" spellcheck="false"
           maxlength="22" placeholder="CP-XXXX-XXXX-XXXX-XXXX">
    <button id="activate" class="primary" type="button">Aktivieren</button>
    <p id="error" class="error" role="alert" hidden></p>
    <p class="note">Der Schlüssel steht in deiner Kaufbestätigung.</p>
  </section>

  <!-- after activation -->
  <section id="screen-active" hidden>
    <p class="ok">✓ Lizenz aktiv</p>
    <p class="lead">CopyPaste Unlocker ist aktiviert.</p>

    <label class="row" for="toggle">
      <span class="text">
        <span class="title">Verknüpfungen</span>
        <span class="status" id="status">An</span>
      </span>
      <input id="toggle" type="checkbox" class="switch" role="switch">
    </label>

    <button id="deactivate" class="secondary" type="button">Lizenz deaktivieren</button>
    <p class="note">Damit wird dieses Gerät freigegeben und der Schlüssel kann woanders
      aktiviert werden.</p>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
