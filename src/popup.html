<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CopyPaste Unlocker</title>
  <link rel="stylesheet" href="boot.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="scan" aria-hidden="true"></div>

  <div class="boot" id="boot">
    <div>
      <img class="eye" src="../assets/mask.svg" alt="">
      <div class="stack">
        <div class="line l1">I'M WATCHING YOU</div>
        <div class="line l2">...just kidding</div>
      </div>
      <div class="skip">click to skip</div>
    </div>
  </div>

  <header class="head">
    <span class="prompt">&gt;_</span>
    <h1 class="brand">copypaste_unlocker</h1>
    <span class="ver">v2.0.0</span>
  </header>

  <div class="screen">
    <video class="video" src="../assets/intro.mp4" autoplay muted loop playsinline controls></video>
    <div class="grid" aria-hidden="true"></div>
  </div>

  <p class="typed"><span>$ unlock --target azubiheft.de</span></p>

  <label class="switchrow" for="toggle">
    <span class="state">
      <span class="dot" id="dot"></span>
      <span class="statetext" id="status">[ BOOTING ]</span>
    </span>
    <input id="toggle" type="checkbox" class="switch" role="switch" disabled>
  </label>

  <dl class="meta">
    <div><dt>target</dt><dd>azubiheft.de</dd></div>
    <div><dt>method</dt><dd>MAIN world @ document_start</dd></div>
    <div><dt>blockers</dt><dd>copy &middot; paste &middot; cut &rarr; <span class="hl">silenced</span></dd></div>
    <div><dt>telemetry</dt><dd class="dim">none. we're not that guy.</dd></div>
  </dl>

  <footer class="foot">
    <span class="hint" id="hint">&nbsp;</span>
    <span class="links">
      <a href="welcome.html" target="_blank" rel="noopener">&gt; full screen</a>
      <button type="button" id="introToggle" class="linkbtn">&gt; intro: ON</button>
    </span>
  </footer>

  <script src="boot.js"></script>
  <script src="popup.js"></script>
</body>
</html>
